{% extends "appbuilder/base.html" %}
{% block content %}
<h2 class="text-center">🎧 Bienvenido a HelpDesk Pro</h2>
<div class="row">
  <div class="col-md-4"><div class="hd-card hd-stat"><h1>{{ estadisticas.total }}</h1>Tickets totales</div></div>
  <div class="col-md-4"><div class="hd-card hd-stat"><h1>{{ estadisticas.abiertos }}</h1>Abiertos</div></div>
  <div class="col-md-4"><div class="hd-card hd-stat"><h1>{{ estadisticas.cerrados }}</h1>Cerrados</div></div>
</div>
<div class="hd-card text-center">
  <a class="btn btn-primary btn-lg" href="/tickets/add">+ Nuevo ticket</a>
  <a class="btn btn-default btn-lg" href="/tickets/list/">Ver tickets</a>
</div>
{% endblock %}
